<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ee0000;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff0000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="26" ry="26" fill="url(#bgGrad)" />

  <!-- Subtle inner border -->
  <rect x="4" y="4" width="120" height="120" rx="26" ry="26"
        fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Glow circle behind play button -->
  <circle cx="64" cy="64" r="36" fill="url(#glowGrad)" />

  <!-- Play button circle background -->
  <circle cx="64" cy="64" r="30" fill="rgba(255,0,0,0.12)" />
  <circle cx="64" cy="64" r="28" fill="rgba(255,255,255,0.05)" stroke="rgba(255,68,68,0.5)" stroke-width="1" />

  <!-- Play triangle -->
  <polygon points="55,46 55,82 88,64" fill="url(#playGrad)" filter="url(#shadow)" />

  <!-- Highlight on play button -->
  <polygon points="55,46 55,58 70,52" fill="rgba(255,255,255,0.2)" />
</svg>
